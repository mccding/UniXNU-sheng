          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Refresh pinned Mesa checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pins_path = core / 'scripts/data/adreno-compiler-inputs.json'
          pins = json.loads(pins_path.read_text())
          pin = pins['mesa']['commit']
          tree = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree'
          source = tree / '.cache/mesa-work'
          build_dir = tree / 'build/mesa-tu-macos27'
          h = hashlib.sha256((pin + '\n').encode())
          h.update(pins_path.read_bytes())
          h.update((core / 'scripts/build-turnip-darwin.py').read_bytes())
          for rel in pins['patches']:
              h.update(rel.encode() + b'\n')
              h.update((core / rel).read_bytes())
          signature = h.hexdigest()
          stamp = tree / '.cache/gpu-reference/unixnu-mesa-patch.sha256'
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
                  if build_dir.exists():
                      shutil.rmtree(build_dir)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Run host tests
        run: |
          python3 device/scripts/check-wn8030-host.py
          python3 device/scripts/check-qcom-tee-wire-host.py
          python3 device/scripts/check-keyboard-service-host.py
          python3 device/scripts/check-keyboard-cover-host.py
          python3 device/scripts/check-lid-clamshell-host.py
          python3 device/scripts/check-backlight-host.py
          python3 device/scripts/check-piano-wn8030-host.py
          python3 device/scripts/check-battery-host.py
      - name: Identify UEFI cache
        id: uefi-key
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          h = hashlib.sha256(b'sheng-uefi-v1\n')
          h.update(subprocess.check_output(['git', '-C', 'uefi-sheng', 'rev-parse', 'HEAD']))
          h.update(subprocess.check_output(['git', '-C', 'UniXNU', 'rev-parse', 'HEAD:drivers/DarwinBoot', 'HEAD:scripts/unixnu/firmware.py']))
          for p in ('device/unixnu.lock', 'device/proprietary-files.txt', 'device/scripts/import-sheng-uefi.py',
                    'device/scripts/check-sheng.py', 'device/scripts/fetch-sheng-dts.py', 'device/dts/sheng.dts',
                    'device/board.toml'):
              h.update(p.encode() + b'\n')
              h.update(Path(p).read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=sheng-uefi-v1-' + h.hexdigest()[:16] + '\n')
          PYTHON
      - name: Restore UEFI cache
        id: uefi-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.uefi-key.outputs.key }}
          path: uefi-sheng/Build/shengPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
      - name: Restore rustup cache
        id: rustup-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-rustup-1.98.0-${{ runner.os }}
          path: ~/.rustup
      - name: Install build tools
        run: |
          if [ '${{ steps.uefi-cache.outputs.cache-hit }}' = 'true' ]; then
            brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
            echo "UNIXNU_REUSE_UEFI=1" >> "$GITHUB_ENV"
          else
            brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 zstd blacktop/tap/ipsw
          fi
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          if ! rustup toolchain list | grep -q '^1\.98\.0'; then
            rustup toolchain install 1.98.0 --profile minimal --component rust-src
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Configure UEFI toolchain
        if: steps.uefi-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          toolchain = Path('uefi-toolchain').resolve()
          toolchain.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (toolchain / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with Path(__import__('os').environ['GITHUB_ENV']).open('a') as output:
              output.write('CLANG_BIN=' + str(toolchain) + '/\n')
          PYTHON
      - name: Identify kernel SDK cache
        id: kernel-sdk
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          from pathlib import Path
          version = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'])
          key = 'sheng-macos27-kernel-v1-' + hashlib.sha256(version).hexdigest()[:16]
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=' + key + '\n')
          PYTHON
      - name: Restore kernel compile records
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.kernel-sdk.outputs.key }}-
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: Identify IPSW runtime cache
        id: runtime-key
        run: |
          python3 - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          h = hashlib.sha256(b'sheng-runtime-v1\n')
          for p in ('UniXNU/profiles/os/macos-27.3-26C5035r/profile.toml',
                    'UniXNU/scripts/list-metal-libraries.py',
                    'UniXNU/scripts/bundle-ipsw-trust.py',
                    'device/scripts/build-bluetooth-userspace.py',
                    'device/unixnu.lock'):
              h.update(p.encode() + b'\n')
              h.update(Path(p).read_bytes())
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('key=sheng-macos27-runtime-v1-' + h.hexdigest()[:16] + '\n')
          PYTHON
      - name: Restore IPSW runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.runtime-key.outputs.key }}
          path: UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime-cache
      - name: Configure runtime cache
        run: |
          cache="$PWD/UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime-cache"
          echo "UNIXNU_RUNTIME_CACHE=$cache" >> "$GITHUB_ENV"
          if [ -d "$cache/ipsw-small" ]; then
            ipsw_dir="UniXNU/out/ipsw/26C5035r"
            mkdir -p "$ipsw_dir"
            cp -R "$cache/ipsw-small/." "$ipsw_dir/"
          fi
      - name: Prepare installation
        working-directory: UniXNU
        run: |
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27
          if [ '${{ inputs.root_storage }}' = true ]; then
            python3 ../device/scripts/prepare-macos-install.py
          else
            python3 ../device/scripts/prepare-macos-install.py --reuse-policies
          fi
      - name: Verify pinned Data seed
        if: ${{ !inputs.root_storage }}
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr')
          assert p.exists() and p.stat().st_size > 0, f'missing or empty {p}'
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f'Verified cached data.dbr ({p.stat().st_size} bytes) SHA-256: {got}')
          PY
      - name: Build images
        id: build-images
        working-directory: device
        run: |
          if [ '${{ steps.runtime-cache.outputs.cache-hit }}' = 'true' ]; then
            scripts/package.sh --os macos-27 --uefi ../uefi-sheng --no-deps
          else
            scripts/package.sh --os macos-27 --uefi ../uefi-sheng
          fi
      - name: Publish shader inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-inventory
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.txt
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/prime-list.json
          retention-days: 1
      - name: Build root storage
        if: inputs.root_storage
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', 'macos-27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', 'macos-27', *objects], check=True)
          PY
      - name: Stage device artifacts
        env:
          BUILD_ROOT_STORAGE: ${{ inputs.root_storage }}
        run: |
          mkdir artifacts
          target=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos
          cp "$target/boot/boot.img" "$target/payload/payload.img" "$target/kernel/kernel.macho" "$target/package.manifest.json" artifacts/
          cp "$target/runtime/data.dbr" artifacts/
          cp "$target/tree/build/prime-list.txt" "$target/tree/build/prime-list.json" artifacts/
          if [ "$BUILD_ROOT_STORAGE" = true ]; then
            cp "$target/userdata/userdata-root.json" artifacts/
            zstd -T0 -3 --sparse "$target/userdata/userdata-root.img" -o artifacts/userdata-root.img.zst
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-macos-27
          path: artifacts/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
            UniXNU/out/sheng/*/*/tree/build/prime-list.*
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.log
            UniXNU/out/sheng/*/*/tree/build/sheng-source-storage/*.command.json
          retention-days: 1
      - name: Save build inputs
        if: always() && steps.build-images.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-venv
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Save pinned Data seed
        if: always() && !inputs.root_storage && steps.build-images.outcome == 'success' && steps.data-seed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-macos27-data-seed-9A4D30E4
          path: UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
      - name: Save kernel compile records
        if: always() && steps.build-images.outcome == 'success' && steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.kernel-sdk.outputs.key }}-${{ github.run_id }}
          path: |
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/xnu-inputs.json
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/xnu-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/fakeroot
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/xnu
      - name: Stage IPSW small cache
        if: always() && steps.build-images.outcome == 'success' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          ipsw_dir = Path('UniXNU/out/ipsw/26C5035r')
          out_dir = Path('UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime-cache/ipsw-small')
          out_dir.mkdir(parents=True, exist_ok=True)
          for p in sorted(ipsw_dir.iterdir()) if ipsw_dir.is_dir() else ():
              if not p.is_file() or p.name.endswith(('.dmg', '.dmg.aea', '.raw', '.partial')) or p.stat().st_size > 150 * 1024 * 1024:
                  continue
              shutil.copy2(p, out_dir / p.name)
          PY
      - name: Save IPSW runtime cache
        if: always() && steps.build-images.outcome == 'success' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.runtime-key.outputs.key }}
          path: UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime-cache
      - name: Save UEFI cache
        if: always() && steps.build-images.outcome == 'success' && steps.uefi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.uefi-key.outputs.key }}
          path: uefi-sheng/Build/shengPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
      - name: Save rustup cache
        if: always() && steps.build-images.outcome == 'success' && steps.rustup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: sheng-rustup-1.98.0-${{ runner.os }}
          path: ~/.rustup
