name: sheng macOS lab

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: UniXNU core branch or commit
        type: string
        default: main
      root_storage:
        description: Build the userdata root image
        type: boolean
        default: true
      export_build_inputs:
        description: Export cached XNU objects and the SDK for a local build
        type: boolean
        default: false
      kernel_cache_key:
        description: Kernel cache to export
        type: string
        default: sheng-macos27-kernel-v1-d509f7e4757a27f5-43684813634

permissions:
  contents: read

concurrency:
  group: macos-lab-${{ github.ref }}-${{ inputs.export_build_inputs && 'inputs' || 'images' }}
  cancel-in-progress: false

jobs:
  local-inputs:
    if: inputs.export_build_inputs
    uses: ./.github/workflows/export-kernel-cache.yml
    with:
      cache_key: ${{ inputs.kernel_cache_key }}
  images:
    if: ${{ !inputs.export_build_inputs }}
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_IPSW_JOBS: 16
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      UNIXNU_LAB_PASSWORD: ${{ secrets.UNIXNU_LAB_PASSWORD }}
    steps:
      - name: Check out device sources
        uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: Patch ShengUfs for dual-boot macos partition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('device/drivers/ShengUfs/RootLayout.h')
          s = p.read_text()
          old = 'static const char wanted[] = "userdata";'
          new = 'static const char wanted[] = "macos";'
          assert old in s, 'wanted[] not found in RootLayout.h'
          p.write_text(s.replace(old, new, 1))

          # Fix upstream Ath12kWifi fetch-sources.py when a moving branch (e.g. FreeBSD releng/15.1) advances past the locked commit
          fp = Path('device/drivers/Ath12kWifi/tools/fetch-sources.py')
          fs = fp.read_text()
          f_old = '    revision = git(directory, "rev-parse", "HEAD")\n'
          f_new = (
              '    if not check_only and git(directory, "rev-parse", "HEAD") != source["commit"]:\n'
              '        subprocess.run(["git", "-C", str(directory), "fetch", "--depth", "1", "origin", source["commit"]], check=True)\n'
              '        subprocess.run(["git", "-C", str(directory), "checkout", "--detach", "FETCH_HEAD"], check=True)\n'
              '    revision = git(directory, "rev-parse", "HEAD")\n'
          )
          assert f_old in fs, 'revision check not found in Ath12kWifi fetch-sources.py'
          fp.write_text(fs.replace(f_old, f_new, 1))
          PY
      - name: Check out core sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.core_ref }}
          path: UniXNU
          submodules: recursive
      - name: Check out firmware sources
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 8156d2e54a9f57818dc8b415a1a7dc28ad9ba4be
          path: uefi-sheng
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Restore build inputs
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-build-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sheng-macos27-build-v1-${{ runner.os }}-
          path: |
            UniXNU/out/feeds
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/adreno-metal-bridge
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/m2v-target
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
            device/drivers/Ath12kWifi/deps
            device/.cache/firmware
      - name: Restore pinned Data seed
        id: data-seed-cache
        if: ${{ !inputs.root_storage }}
        uses: actions/cache/restore@v4
        with:
          key: sheng-macos27-data-seed-9A4D30E4
          path: UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
      - name: Apply Stage 1, Stage 2, and Stage 3 patches
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path

          mm = Path('uefi-sheng/Platforms/Xiaomi/shengPkg/Library/MemoryMapLib/MemoryMapLib.c')
          mm_src = mm.read_text()
          mm_subs = [
              (
                  'Memory = FdtPathOffset (Fdt, "/memory");',
                  'Memory = FdtPathOffset (Fdt, "/memory");\n  if (Memory < 0 && Root >= 0) {\n    for (INT32 Node = FdtFirstSubnode (Fdt, Root); Node >= 0; Node = FdtNextSubnode (Fdt, Node)) {\n      CONST CHAR8 *Type = FdtGetProp (Fdt, Node, "device_type", &Length);\n      if (Type != NULL && Length == 7 && CompareMem (Type, "memory", 7) == 0) { Memory = Node; break; }\n    }\n  }',
              ),
              (
                  'Fdt32ToCpu (ReadUnaligned32 (Value)) != 8',
                  '(Fdt32ToCpu (ReadUnaligned32 (Value)) != 8 && Fdt32ToCpu (ReadUnaligned32 (Value)) != 12 && Fdt32ToCpu (ReadUnaligned32 (Value)) != 16)',
              ),
              (
                  '(Base >= 0x880000000ULL && End <= 0xa00000000ULL)',
                  '(Base >= 0x880000000ULL && End <= 0xc00000000ULL)',
              ),
              (
                  'if (Base == 0x8c0000000ULL && End == 0xa00000000ULL) { HasHighBank = TRUE; }',
                  'if (Base == 0x8c0000000ULL && End >= 0x900000000ULL && End <= 0xc00000000ULL) { HasHighBank = TRUE; }',
              ),
              (
                  '(Inputs[I].Base >= 0x880000000ULL && Inputs[I].End <= 0xa00000000ULL)',
                  '(Inputs[I].Base >= 0x880000000ULL && Inputs[I].End <= 0xc00000000ULL)',
              ),
          ]
          for old, new in mm_subs:
              assert old in mm_src, f'missing in MemoryMapLib.c: {old}'
              mm_src = mm_src.replace(old, new, 1)
          mm.write_text(mm_src)

          ws = Path('UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/WindowSize.h')
          ws_src = ws.read_text()
          ws_old = 'size <= 0x200000000ULL'
          ws_new = 'size <= 0x340000000ULL'
          assert ws_old in ws_src, f'missing in WindowSize.h: {ws_old}'
          ws.write_text(ws_src.replace(ws_old, ws_new, 1))

          dt = Path('UniXNU/scripts/unixnu/devicetree.py')
          dt_src = dt.read_text()
          dt_old = '0x10000000 <= size <= 0x200000000'
          dt_new = '0x10000000 <= size <= 0x340000000'
          assert dt_old in dt_src, f'missing in devicetree.py: {dt_old}'
          dt.write_text(dt_src.replace(dt_old, dt_new, 1))

          patch_src = Path('device/patches/translator/0001-metal2vulkan-4mib-unit-blocks.patch').read_text().replace('\r\n', '\n')
          patch_dir = Path('UniXNU/drivers/AdrenoMetal/bridge/patches')
          patch_dir.mkdir(parents=True, exist_ok=True)
          (patch_dir / '0001-metal2vulkan-4mib-unit-blocks.patch').write_text(patch_src, newline='\n')

          bridge = Path('UniXNU/scripts/build-adreno-metal-bridge.py')
          br_src = bridge.read_text()
          empty_pat = "PATCHES = [ROOT / 'drivers/AdrenoMetal/bridge/patches' / name for name in [\n]]"
          if empty_pat in br_src:
              br_src = br_src.replace(
                  empty_pat,
                  "PATCHES = [ROOT / 'drivers/AdrenoMetal/bridge/patches' / name for name in [\n    '0001-metal2vulkan-4mib-unit-blocks.patch',\n]]",
                  1,
              )
          elif "'0001-metal2vulkan-4mib-unit-blocks.patch'" not in br_src:
              anchor = "PATCHES = [ROOT / 'drivers/AdrenoMetal/bridge/patches' / name for name in ["
              pos = br_src.find(anchor)
              assert pos != -1, 'PATCHES declaration not found in build-adreno-metal-bridge.py'
              close = br_src.find('\n]]', pos)
              assert close != -1, 'PATCHES closing bracket not found in build-adreno-metal-bridge.py'
              br_src = br_src[:close] + "\n    '0001-metal2vulkan-4mib-unit-blocks.patch'," + br_src[close:]
          bridge.write_text(br_src)

          am_dir = Path('UniXNU/drivers/AdrenoMetal')
          air_src = Path('device/patches/adreno-metal/AirSignature.h').read_text().replace('\r\n', '\n')
          (am_dir / 'AirSignature.h').write_text(air_src, newline='\n')
          for patch in sorted(Path('device/patches/adreno-metal').glob('*.patch')):
              subprocess.run(['git', '-C', str(am_dir), 'apply', str(patch.resolve())], check=True)

          mesa_dir = Path('UniXNU/patches/mesa')
          pins_path = Path('UniXNU/scripts/data/adreno-compiler-inputs.json')
          pins = json.loads(pins_path.read_text())
          for name in (
              'turnip-darwin-idle-trim-reclaim.patch',
              'turnip-darwin-cs-reserve.patch',
              'turnip-darwin-sysmem-feedback-flush.patch',
          ):
              src_text = (Path('device/patches/adreno-mesa') / name).read_text().replace('\r\n', '\n')
              (mesa_dir / name).write_text(src_text, newline='\n')
              rel = f'patches/mesa/{name}'
              if rel not in pins['patches']:
                  pins['patches'].append(rel)
          pins_path.write_text(json.dumps(pins, indent=2) + '\n')

          # Stage 3 UFS WriteBooster + max I/O + NativeRamBlock staging + display swap_submit backlight hook
          rc = Path('device/drivers/ShengUfs/RootCommands.h')
          rc_src = rc.read_text()
          assert 'static constexpr uint32_t kXferMax = 1U << 20' in rc_src, 'kXferMax != 1 MiB in RootCommands.h'
          rc_old = '\n'.join([
              '// Query read request (opcode 0x03 READ ATTRIBUTE / 0x05 READ FLAG). Returns the value field.',
              'static IOReturn hostQueryRead (uint8_t opcode, uint8_t idn, uint32_t *value)',
              '{',
              '  if (!value || (opcode != 3 && opcode != 5)) return kIOReturnBadArgument;',
              '  const UfsSlot slot = ufsSlot (0);',
              '  if (!hostClearUcd (slot)) return kIOReturnNotReady;',
              '  uint8_t *ucd = slot.ucd;',
              '  ucd[0] = 0x16;                      // QUERY REQUEST',
              '  ucd[3] = 1;',
              '  ucd[5] = 0x01;                      // standard read request (header dword 1, byte 1)',
              '  ucd[12] = opcode;',
              '  ucd[13] = idn;',
              '  uint32_t ocs = 0xf;',
              '  IOReturn status = hostSubmit (slot, 0, 0, 200000, &ocs);',
              '  if (status != kIOReturnSuccess) {',
              '    return status;',
              '  }',
              '  status = hostResponseHeader (slot, 0x36, 0, 1);',
              '  if (status != kIOReturnSuccess) return status;',
              '  const uint8_t *rsp = ucd + kRspOffset;',
              '  if (rsp[10] || rsp[11]) return hostProtocolError (4);',
              '  if (rsp[12] != opcode || rsp[13] != idn || rsp[14] || rsp[15]) return hostProtocolError (5);',
              '  if (rsp[6] != 0) {',
              '    gRootDiagnostic.result = static_cast<uint32_t> (kIOReturnError);',
              '    return kIOReturnError;',
              '  }',
              '  *value = loadBe32 (rsp + 20);',
              '  return kIOReturnSuccess;',
              '}',
          ])
          rc_new = '\n'.join([
              '// Query request (0x03 READ ATTR, 0x05 READ FLAG, 0x06 SET FLAG, 0x07 CLEAR FLAG). Returns the value field.',
              'static IOReturn hostQuery (uint8_t opcode, uint8_t idn, uint8_t index, uint32_t *value)',
              '{',
              '  const bool write = opcode == 6 || opcode == 7;',
              '  if (!value || (opcode != 3 && opcode != 5 && !write)) return kIOReturnBadArgument;',
              '  const UfsSlot slot = ufsSlot (0);',
              '  if (!hostClearUcd (slot)) return kIOReturnNotReady;',
              '  uint8_t *ucd = slot.ucd;',
              '  ucd[0] = 0x16;                      // QUERY REQUEST',
              '  ucd[3] = 1;',
              '  ucd[5] = write ? 0x81 : 0x01;       // standard write / read request (header dword 1, byte 1)',
              '  ucd[12] = opcode;',
              '  ucd[13] = idn;',
              '  ucd[14] = index;',
              '  uint32_t ocs = 0xf;',
              '  IOReturn status = hostSubmit (slot, 0, 0, 200000, &ocs);',
              '  if (status != kIOReturnSuccess) {',
              '    return status;',
              '  }',
              '  status = hostResponseHeader (slot, 0x36, 0, 1);',
              '  if (status != kIOReturnSuccess) return status;',
              '  const uint8_t *rsp = ucd + kRspOffset;',
              '  if (rsp[10] || rsp[11]) return hostProtocolError (4);',
              '  if (rsp[12] != opcode || rsp[13] != idn || rsp[14] != index || rsp[15]) return hostProtocolError (5);',
              '  if (rsp[6] != 0) {',
              '    gRootDiagnostic.result = static_cast<uint32_t> (kIOReturnError);',
              '    return kIOReturnError;',
              '  }',
              '  *value = loadBe32 (rsp + 20);',
              '  return kIOReturnSuccess;',
              '}',
              'static IOReturn hostQueryRead (uint8_t opcode, uint8_t idn, uint32_t *value)',
              '{',
              '  return hostQuery (opcode, idn, 0, value);',
              '}',
          ])
          assert rc_old in rc_src, 'missing hostQueryRead in RootCommands.h'
          rc.write_text(rc_src.replace(rc_old, rc_new, 1))

          disk_id_text = Path('device/package/PianoDiskIdentity.h').read_text()
          Path('device/drivers/ShengUfs/PianoDiskIdentity.h').write_text(disk_id_text)
          Path('UniXNU/drivers/RamBlock/PianoDiskIdentity.h').write_text(disk_id_text)

          nu = Path('device/drivers/ShengUfs/NativeUfs.cpp')
          nu_src = nu.read_text()
          nu_inc_old = '#include <IOKit/IOLib.h>'
          nu_inc_new = '#include <IOKit/IOLib.h>\n#include "PianoDiskIdentity.h"'
          assert nu_inc_old in nu_src, 'missing IOLib.h include in NativeUfs.cpp'
          nu_src = nu_src.replace(nu_inc_old, nu_inc_new, 1)
          nu_vendor_old = '  char *getVendorString () override { return const_cast<char *> ("Native"); }'
          nu_vendor_new = '  char *getVendorString () override { return const_cast<char *> (pianodisk::enabled () ? pianodisk::kVendor : "Native"); }'
          assert nu_vendor_old in nu_src, 'missing getVendorString in NativeUfs.cpp'
          nu_src = nu_src.replace(nu_vendor_old, nu_vendor_new, 1)
          nu_state_old = '\n'.join([
              '  *why = "LUN 0 not ready";',
              '  return false;',
              '}',
              '}',
              '',
              'namespace {',
              'static uint32_t be32w (const uint8_t *at)',
          ])
          nu_state_new = '\n'.join([
              '  *why = "LUN 0 not ready";',
              '  return false;',
              '}',
              '',
              'struct UfsDeviceState {',
              '  uint32_t value[10];',
              '  uint32_t failed = 0;',
              '  bool wbRequested = false;',
              '  uint32_t wbBefore[3] = { 0xffffffffU, 0xffffffffU, 0xffffffffU };',
              '  uint32_t wbAfter[3] = { 0xffffffffU, 0xffffffffU, 0xffffffffU };',
              '  unsigned wbSets = 0, wbSetFailures = 0;',
              '  bool stoppedPoisoned = false;',
              '};',
              'struct UfsStateRead { uint8_t opcode, idn; };',
              'static constexpr UfsStateRead kStateReads[10] = {',
              '  { 0x03, 0x02 }, { 0x03, 0x03 }, { 0x05, 0x0e }, { 0x05, 0x0f }, { 0x05, 0x10 },',
              '  { 0x03, 0x1d }, { 0x03, 0x1f }, { 0x03, 0x1e }, { 0x03, 0x1c }, { 0x03, 0x05 },',
              '};',
              'static constexpr uint8_t kWbFlags[3] = { 0x0e, 0x10, 0x0f };',
              'static constexpr unsigned kWbRead[3] = { 2, 4, 3 };',
              'static void hostDeviceState (bool enableWb, UfsDeviceState *s)',
              '{',
              '  *s = UfsDeviceState {};',
              '  s->wbRequested = enableWb;',
              '  for (unsigned i = 0; i < 10; ++i) {',
              '    s->value[i] = 0xffffffffU;',
              '    if (gHost.poisoned) { s->stoppedPoisoned = true; s->failed |= 1U << i; continue; }',
              '    uint32_t v = 0;',
              '    if (hostQuery (kStateReads[i].opcode, kStateReads[i].idn, 0, &v) == kIOReturnSuccess) s->value[i] = v;',
              '    else s->failed |= 1U << i;',
              '  }',
              '  for (unsigned k = 0; k < 3; ++k) s->wbBefore[k] = s->wbAfter[k] = s->value[kWbRead[k]];',
              '  if (!enableWb) return;',
              '  for (unsigned k = 0; k < 3; ++k) {',
              '    if (gHost.poisoned) { s->stoppedPoisoned = true; return; }',
              '    if (s->wbBefore[k] == 1) continue;',
              '    uint32_t v = 0;',
              '    ++s->wbSets;',
              '    if (hostQuery (0x06, kWbFlags[k], 0, &v) != kIOReturnSuccess) { ++s->wbSetFailures; continue; }',
              '    if (gHost.poisoned) { s->stoppedPoisoned = true; return; }',
              '    uint32_t back = 0xffffffffU;',
              '    if (hostQuery (0x05, kWbFlags[k], 0, &back) == kIOReturnSuccess) s->wbAfter[k] = back;',
              '  }',
              '}',
              '}',
              '',
              'namespace {',
              'static uint32_t be32w (const uint8_t *at)',
          ])
          assert nu_state_old in nu_src, 'missing hostBringUp tail in NativeUfs.cpp'
          nu_src = nu_src.replace(nu_state_old, nu_state_new, 1)

          nu_maxio_old = '  online = true;\n  registerService ();'
          nu_maxio_new = '\n'.join([
              '  {',
              '    uint32_t maxIoKiB = 1024;',
              '    PE_parse_boot_argn ("native-ufs-maxio", &maxIoKiB, sizeof maxIoKiB);',
              '    if (maxIoKiB < 64) maxIoKiB = 64;',
              '    if (maxIoKiB > 1024) maxIoKiB = 1024;',
              '    setProperty ("IOMaximumByteCountRead", static_cast<unsigned long long> (maxIoKiB) * 1024ULL, 64);',
              '    setProperty ("IOMaximumBlockCountRead", static_cast<unsigned long long> (maxIoKiB) * 2ULL, 64);',
              '  }',
              '  pianodisk::publish (this, label, "1.0");',
              '  online = true;',
              '  registerService ();',
          ])
          assert nu_maxio_old in nu_src, 'missing NativeUfsBlock::start tail in NativeUfs.cpp'
          nu_src = nu_src.replace(nu_maxio_old, nu_maxio_new, 1)

          nu_root_old = '  native_ufs_root_step = 2;\n  RootLayout *layout'
          nu_root_new = '\n'.join([
              '  native_ufs_root_step = 2;',
              '  {',
              '    uint32_t wbArg = 0;',
              '    const bool wantWb = PE_parse_boot_argn ("native-ufs-wb", &wbArg, sizeof wbArg) && wbArg == 1;',
              '    UfsDeviceState devState;',
              '    hostDeviceState (wantWb, &devState);',
              '    IOLog ("NativeUfs: ufs-state: power=0x%x icc=0x%x wb=%u->%u flush=%u->%u h8=%u->%u avail=%u size=%u life=0x%x fstat=%u bkops=%u sets=%u fail=%u poisoned=%u\\n",',
              '           devState.value[0], devState.value[1], devState.wbBefore[0], devState.wbAfter[0],',
              '           devState.wbBefore[2], devState.wbAfter[2], devState.wbBefore[1], devState.wbAfter[1],',
              '           devState.value[5], devState.value[6], devState.value[7], devState.value[8], devState.value[9],',
              '           devState.wbSets, devState.wbSetFailures, devState.stoppedPoisoned ? 1U : 0U);',
              '  }',
              '  RootLayout *layout',
          ])
          assert nu_root_old in nu_src, 'missing startRoot anchor in NativeUfs.cpp'
          nu.write_text(nu_src.replace(nu_root_old, nu_root_new, 1))

          rb = Path('UniXNU/drivers/RamBlock/NativeRamBlock.cpp')
          rb_src = rb.read_text()
          rb_inc_old = '#include "DirectDisk.h"'
          rb_inc_new = '#include "DirectDisk.h"\n#include "PianoDiskIdentity.h"'
          assert rb_inc_old in rb_src, 'missing DirectDisk.h include in NativeRamBlock.cpp'
          rb_src = rb_src.replace(rb_inc_old, rb_inc_new, 1)
          rb_vendor_old = '  char *getVendorString() override { return const_cast<char *>("Native"); }\n  char *getProductString() override { return const_cast<char *>("Owned RAM block storage"); }'
          rb_vendor_new = '  char *getVendorString() override { return const_cast<char *>(pianodisk::enabled() ? pianodisk::kVendor : "Native"); }\n  char *getProductString() override { return const_cast<char *>(pianodisk::enabled() ? "UFS Data" : "Owned RAM block storage"); }'
          assert rb_vendor_old in rb_src, 'missing vendor/product getters in NativeRamBlock.cpp'
          rb_src = rb_src.replace(rb_vendor_old, rb_vendor_new, 1)
          rb_stage_old = '  static constexpr uint32_t kStagePages = 32;'
          rb_stage_new = '  static constexpr uint32_t kStagePages = 64;'
          assert rb_stage_old in rb_src, 'missing kStagePages in NativeRamBlock.cpp'
          rb_src = rb_src.replace(rb_stage_old, rb_stage_new, 1)
          rb_start_old = '  online = true;\n  native_ram_block_ready = 1;\n  registerService();'
          rb_start_new = '\n'.join([
              '  setProperty("IOMaximumByteCountRead", 1048576ULL, 64);',
              '  setProperty("IOMaximumByteCountWrite", 1048576ULL, 64);',
              '  setProperty("IOMaximumBlockCountRead", 2048ULL, 64);',
              '  setProperty("IOMaximumBlockCountWrite", 2048ULL, 64);',
              '  pianodisk::publish(this, "UFS Data", "1.0");',
              '  online = true;',
              '  native_ram_block_ready = 1;',
              '  registerService();',
          ])
          assert rb_start_old in rb_src, 'missing start() tail in NativeRamBlock.cpp'
          rb.write_text(rb_src.replace(rb_start_old, rb_start_new, 1))

          ld = Path('UniXNU/drivers/GopFramebuffer/NativeLegacyDisplay.cpp')
          ld_src = ld.read_text()
          ld_head_old = 'extern "C" bool native_legacy_prepare_scanout(void);'
          ld_head_new = '\n'.join([
              'extern "C" bool native_legacy_prepare_scanout(void);',
              '#if defined(NATIVE_LEGACY_MACOS) && NATIVE_LEGACY_MACOS',
              'extern "C" void sheng_backlight_set_nits(int32_t fixed) __attribute__((weak_import));',
              'static inline int32_t swapNitsFixed(uint64_t bits) {',
              '    const uint32_t exponent = uint32_t(bits >> 52) & 0x7ffu;',
              '    if ((bits >> 63) || exponent == 0 || exponent == 0x7ffu) return 0;',
              '    const uint64_t mantissa = (bits & ((uint64_t(1) << 52) - 1)) | (uint64_t(1) << 52);',
              '    const int shift = int(exponent) - 1075 + 16;',
              '    if (shift >= 0) return shift > 10 ? INT32_MAX : (mantissa << shift) > uint64_t(INT32_MAX) ? INT32_MAX : int32_t(mantissa << shift);',
              '    return shift <= -64 ? 0 : (mantissa >> -shift) > uint64_t(INT32_MAX) ? INT32_MAX : int32_t(mantissa >> -shift);',
              '}',
              '#endif',
          ])
          assert ld_head_old in ld_src, 'missing head anchor in NativeLegacyDisplay.cpp'
          ld_src = ld_src.replace(ld_head_old, ld_head_new, 1)
          ld_mem_old = '    uint64_t validatedAt[8];   // no initializer: IOKit objects are allocated zeroed'
          ld_mem_new = '\n'.join([
              '#if defined(NATIVE_LEGACY_MACOS) && NATIVE_LEGACY_MACOS',
              '    int32_t lastSwapNits;',
              '#endif',
              '    uint64_t validatedAt[8];   // no initializer: IOKit objects are allocated zeroed',
          ])
          assert ld_mem_old in ld_src, 'missing validatedAt in NativeLegacyDisplay.cpp'
          ld_src = ld_src.replace(ld_mem_old, ld_mem_new, 1)
          ld_swap_old = '    IOReturn swapSetColorMatrix(void *,uint32_t,uint32_t) override {return kIOReturnSuccess;}\n#endif'
          ld_swap_new = '\n'.join([
              '    IOReturn swapSetColorMatrix(void *,uint32_t,uint32_t) override {return kIOReturnSuccess;}',
              '    IOReturn swap_submit(void *rec, void *client, uint32_t *out) override {',
              '        if (rec && sheng_backlight_set_nits) {',
              '            const uint8_t *b = static_cast<const uint8_t *>(rec);',
              '            if (b[0x3b4] & 1u) {',
              '                uint64_t bits = 0;',
              '                memcpy(&bits, b + 0x3be, sizeof bits);',
              '                const int32_t fixed = swapNitsFixed(bits);',
              '                if (fixed >= (2 << 16) && fixed <= (1000 << 16) && fixed != lastSwapNits) {',
              '                    lastSwapNits = fixed;',
              '                    sheng_backlight_set_nits(fixed);',
              '                }',
              '            }',
              '        }',
              '        return IOMobileFramebufferLegacy::swap_submit(rec, client, out);',
              '    }',
              '#endif',
          ])
          assert ld_swap_old in ld_src, 'missing swapSetColorMatrix in NativeLegacyDisplay.cpp'
          ld.write_text(ld_src.replace(ld_swap_old, ld_swap_new, 1))

          # Fix icon-cache daemon exit code 1 by stopping iconservicesd/agent first and handling busy top dir.
          icon_rt = Path('UniXNU/scripts/build-boot-runtime.py')
          icon_src = icon_rt.read_text()
          icon_old = '\n'.join([
              '    /bin/rm -rf "$root/Library/Caches/com.apple.iconservices.store" || exit 1',
              '    folders="$root/private/var/folders"',
              '    if [ -d "$folders" ]; then',
              '        /usr/bin/find -P "$folders" -mindepth 4 -maxdepth 4 \\',
              '            \\( -path \'*/C/com.apple.iconservices\' -o -path \'*/C/com.apple.iconservices.store\' \\) \\',
              '            -execdir /bin/rm -rf -- {} + || exit 1',
              '    fi',
              '    restart_icon_services || exit 1',
          ])
          icon_new = '\n'.join([
              '    restart_icon_services || true',
              '    /bin/sleep 1',
              '    if [ -e "$root/Library/Caches/com.apple.iconservices.store" ]; then',
              '        /bin/rm -rf "$root/Library/Caches/com.apple.iconservices.store" 2>/dev/null || \\',
              '            /usr/bin/find "$root/Library/Caches/com.apple.iconservices.store" -mindepth 1 -maxdepth 1 -exec /bin/rm -rf -- {} + || true',
              '    fi',
              '    folders="$root/private/var/folders"',
              '    if [ -d "$folders" ]; then',
              '        /usr/bin/find -P "$folders" -mindepth 4 -maxdepth 4 \\',
              '            \\( -path \'*/C/com.apple.iconservices\' -o -path \'*/C/com.apple.iconservices.store\' \\) \\',
              '            -execdir /bin/rm -rf -- {} + 2>/dev/null || true',
              '    fi',
              '    restart_icon_services || true',
          ])
          assert icon_old in icon_src, 'missing ICON_CACHE_FUNCTION rm block in build-boot-runtime.py'
          icon_rt.write_text(icon_src.replace(icon_old, icon_new, 1))
          print('Applied Stage 1, Stage 2, and Stage 3 patches.')
          PY
      - name: Refresh pinned translator checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pin = json.loads((core / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']['commit']
          source = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree/.cache/gpu-reference/metal2vulkan'
          signature = hashlib.sha256((pin + '\n').encode() + (core / 'scripts/build-adreno-metal-bridge.py').read_bytes() + b''.join(path.read_bytes() for path in sorted((core / 'drivers/AdrenoMetal/bridge/patches').glob('*.patch')))).hexdigest()
          stamp = source.with_name('unixnu-translator-patch.sha256')
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Refresh pinned Mesa checkout
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, shutil, subprocess
          from pathlib import Path
          core = Path('UniXNU')
          pins_path = core / 'scripts/data/adreno-compiler-inputs.json'
          pins = json.loads(pins_path.read_text())
          pin = pins['mesa']['commit']
          tree = core / 'out/sheng/macos-27.3-26C5035r/sheng_macos/tree'
          source = tree / '.cache/mesa-work'
          build_dir = tree / 'build/mesa-tu-macos27'
          h = hashlib.sha256((pin + '\n').encode())
          h.update(pins_path.read_bytes())
          h.update((core / 'scripts/build-turnip-darwin.py').read_bytes())
          for rel in pins['patches']:
              h.update(rel.encode() + b'\n')
              h.update((core / rel).read_bytes())
          signature = h.hexdigest()
          stamp = tree / '.cache/gpu-reference/unixnu-mesa-patch.sha256'
          if source.exists():
              actual = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin or not stamp.exists() or stamp.read_text().strip() != signature:
                  shutil.rmtree(source)
                  if build_dir.exists():
                      shutil.rmtree(build_dir)
          stamp.parent.mkdir(parents=True, exist_ok=True)
          stamp.write_text(signature + '\n')
          PYTHON
      - name: Run host tests
